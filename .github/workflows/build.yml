name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check embedded players
        run: node Tests/player-host.test.mjs
      - name: Test desktop client
        run: dotnet run --project Tests/Tests.csproj -c Release -r win-x64 --self-contained true
      - name: Build Windows app
        run: dotnet publish Yoru/Yoru.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o outputs/Yoru
      - uses: actions/upload-artifact@v4
        with:
          name: Yoru-Windows
          path: outputs/Yoru
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, test and lint Android
        working-directory: android
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug --console plain
      - uses: actions/upload-artifact@v4
        with:
          name: Yoru-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase migration and account rules
        run: bash Tests/database.sh
