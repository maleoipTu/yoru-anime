name: Android player smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-player:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Check real native playback on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            status=0
            bash android/gradlew -p android connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.live=true --console plain || status=$?
            mkdir -p outputs/android-qa
            adb pull /sdcard/Android/data/app.yoru.anime/files/qa outputs/android-qa/ || true
            exit "$status"
      - name: Save test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-player-QA
          path: |
            outputs/android-qa
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
