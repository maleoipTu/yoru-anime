plugins { id 'com.android.application' }
// Адрес и публичный anon-ключ Supabase: из переменных окружения или из supabase.properties в корне репозитория.
def supabase = new Properties()
def supabaseFile = rootProject.file('../supabase.properties')
if (supabaseFile.exists()) supabaseFile.withReader('UTF-8') { supabase.load(it) }
def supabaseUrl = System.getenv('YORU_SUPABASE_URL') ?: supabase.getProperty('url', '')
def supabaseKey = System.getenv('YORU_SUPABASE_ANON_KEY') ?: supabase.getProperty('anon_key', '')
android {
    namespace 'app.yoru.anime'
    compileSdk 35
    defaultConfig {
        applicationId 'app.yoru.anime'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.7.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SUPABASE_URL', '"' + supabaseUrl.trim() + '"'
        buildConfigField 'String', 'SUPABASE_ANON_KEY', '"' + supabaseKey.trim() + '"'
    }
    signingConfigs {
        personal {
            if (System.getenv('YORU_STORE_FILE')) {
                storeFile file(System.getenv('YORU_STORE_FILE'))
                storePassword System.getenv('YORU_STORE_PASSWORD')
                keyAlias 'yoru'
                keyPassword System.getenv('YORU_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('YORU_STORE_FILE')) signingConfig signingConfigs.personal
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
